<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Guardian</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>
  <main class="app">
    <header class="app-header">
      <img
        class="brand-icon"
        src="icons/icon48.png"
        alt=""
        aria-hidden="true"
      >

      <div>
        <h1>QR Guardian</h1>

        <p class="subtitle">
          Inspect links before opening them.
        </p>
      </div>
    </header>

    <section class="url-section">
      <label for="urlInput">
        Website address
      </label>

      <input
        id="urlInput"
        type="url"
        placeholder="Paste a URL to inspect"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        id="checkButton"
        type="button"
      >
        Check URL
      </button>
    </section>

    <section
      id="resultCard"
      class="result-card"
      hidden
    >
      <div class="result-header">
        <span
          id="verdictBadge"
          class="verdict-badge"
        >
          Checking
        </span>

        <span id="hostnameValue"></span>
      </div>

      <h2 id="resultTitle">
        Checking URL
      </h2>

      <p id="resultMessage"></p>

      <div
        id="destinationSection"
        class="result-detail"
        hidden
      >
        <span class="detail-label">
          Destination
        </span>

        <span id="destinationValue"></span>
      </div>

      <div
        id="virusTotalSection"
        class="virustotal-section"
        hidden
      >
        <div class="section-heading">
          <h3>VirusTotal Details</h3>

          <span id="analysisDateValue"></span>
        </div>

        <div class="stats-grid">
          <div class="stat-item malicious-stat">
            <span
              id="maliciousValue"
              class="stat-value"
            >
              0
            </span>

            <span class="stat-label">
              Malicious
            </span>
          </div>

          <div class="stat-item suspicious-stat">
            <span
              id="suspiciousValue"
              class="stat-value"
            >
              0
            </span>

            <span class="stat-label">
              Suspicious
            </span>
          </div>

          <div class="stat-item harmless-stat">
            <span
              id="harmlessValue"
              class="stat-value"
            >
              0
            </span>

            <span class="stat-label">
              Harmless
            </span>
          </div>

          <div class="stat-item undetected-stat">
            <span
              id="undetectedValue"
              class="stat-value"
            >
              0
            </span>

            <span class="stat-label">
              Undetected
            </span>
          </div>
        </div>
      </div>

      <div
        id="warningsSection"
        class="warnings-section"
        hidden
      >
        <h3>Warnings</h3>

        <ul id="warningsList"></ul>
      </div>
    </section>

    <button
      id="openButton"
      type="button"
      hidden
    >
      Open Website
    </button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
