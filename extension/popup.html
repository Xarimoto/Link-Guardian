<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h1>QR Guardian</h1>
  <p>Scan and inspect links before opening them.</p>

  <input
    id="urlInput"
    type="url"
    placeholder="Paste a URL to inspect"
  >

  <button id="checkButton" type="button">
    Check URL
  </button>
  <button id="openButton" type="button" hidden>Open Website</button>

  <p id="result"></p>

  <script src="popup.js"></script>
</body>
</html>
